
<form class="filter-form">

  <div class="row">

    <!-- Company Filter -->
    <div class="col-md-6">

      <mat-form-field appearance="outline" class="w-100">

        <mat-label class="label">
          اسم الشركة
        </mat-label>

        <mat-select
          (selectionChange)="applyRequestTypeFilter($event.value)">

          <mat-option
            *ngFor="let type of requestTypes"
            [value]="type.value">

            {{ type.label }}

          </mat-option>

        </mat-select>

      </mat-form-field>

    </div>


    <!-- Excel -->
    <div class="col-md-6">

      <div class="diagram-container d-flex align-items-center">

        <mat-icon>
          description
        </mat-icon>

        <span class="ml-2">
          تصدير البيانات
        </span>

        <button
          mat-button
          type="button"
          (click)="exportToExcel()"
          class="ml-2">

          تحميل ملف الإكسيل

        </button>

      </div>

    </div>

  </div>

</form>


<!-- Companies Table -->

<div class="table-wrapper">

  <table>

    <thead>

      <tr>

        <th>العدد</th>

        <th>اسم الشركة</th>

        <th>طلبات الشركات الجديدة</th>

        <th>التعديلات</th>

        <th>الطلبات التي لم يتم رفعها</th>

        <th>التاريخ</th>

        <th>تم الإنشاء بواسطة</th>

      </tr>

    </thead>


    <tbody>

      <tr
        *ngFor="let item of companies; let i = index">

        <td>
          {{ i + 1 }}
        </td>

        <td class="company-name">
          {{ item.companyName }}
        </td>

        <td>
          {{ item.report }}
        </td>

        <td>
          {{ item.reportEdit }}
        </td>

        <td>
          {{ item.reportLmetmelraf }}
        </td>

        <td>
          {{ item.date }}
        </td>

        <td>
          {{ item.user }}
        </td>

      </tr>

    </tbody>

  </table>

</div>
